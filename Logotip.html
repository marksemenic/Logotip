<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EA Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;   
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #24306b 0%, #151a3d 35%, #090d24 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: white;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: linear-gradient(180deg, rgba(4, 8, 35, 0.96), rgba(2, 5, 24, 0.98));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 26px;
      padding: 34px 28px 26px;
      box-shadow:
        0 24px 60px rgba(0,0,0,0.55),
        0 0 0 1px rgba(255,255,255,0.03) inset;
    }

    .title {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -0.2px;
    }

    .logo-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .logo-card {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 12px 10px 14px;
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .logo-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.07);
    }

    .logo-circle {
      width: 78px;
      height: 78px;
      margin: 0 auto 8px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ff4747;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    .logo-circle img,
    .logo-circle svg,
    .logo-circle canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .png-logo {
      position: relative;
      background: #ff4747;
    }

    .png-logo::before {
      content: "";
      position: absolute;
      inset: 6px;
      background: white;
      border-radius: 50%;
    }

    .png-logo img {
      position: relative;
      z-index: 1;
      width: 112%;
      height: 112%;
      object-fit: contain;
      display: block;
    }

    .logo-card p {
      font-size: 12px;
      color: #d8defe;
    }

    /* POPRAVLJEN DIVIDER */
    .divider {
      display: flex;
      align-items: center;
      margin: 6px 0 18px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.12);
    }

    .label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.1px;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .input {
      width: 100%;
      padding: 15px 16px;
      border: 2px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      color: white;
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .input:focus {
      border-color: rgba(76, 121, 255, 0.8);
      box-shadow: 0 0 0 4px rgba(45,100,227,0.15);
      background: rgba(255,255,255,0.04);
    }

    .input::placeholder {
      color: #7f89bb;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 20px;
      font-size: 14px;
      color: white;
    }

    .remember input {
      width: 16px;
      height: 16px;
      accent-color: #2d64e3;
    }

    .primary-btn,
    .secondary-btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.2s ease;
    }

    .primary-btn:hover,
    .secondary-btn:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .primary-btn {
      border: none;
      background: linear-gradient(180deg, #4576ff 0%, #2d64e3 100%);
      color: white;
      margin-bottom: 18px;
      box-shadow: 0 10px 18px rgba(45,100,227,0.3);
    }

    .secondary-btn {
      border: 2px solid #2d64e3;
      background: transparent;
      color: white;
      margin-top: 8px;
    }

    .helper-link {
      display: block;
      color: #5d8cff;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 10px;
      text-align: left;
    }

    .helper-link:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #aeb6e8;
      opacity: 0.9;
    }

    @media (max-width: 520px) {
      .login-box {
        padding: 26px 18px 22px;
      }

      .logo-circle {
        width: 70px;
        height: 70px;
      }

      .title {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="title">Sign in to your EA Account</div>

    <div class="logo-row">
      <div class="logo-card">
        <div class="logo-circle png-logo">
          <img src="EAlogo.png" alt="EA PNG">
        </div>
        <p>EA PNG</p>
      </div>

      <div class="logo-card">
        <div class="logo-circle">
          <canvas id="eaCanvas" width="78" height="78"></canvas>
        </div>
        <p>EA Canvas</p>
      </div>

      <div class="logo-card">
        <div class="logo-circle">
          <svg viewBox="0 0 960 960" xmlns="http://www.w3.org/2000/svg">
            <circle cx="480" cy="480" r="480" fill="#ff4747"/>
            <path fill="white" d="M207.51,426.54H461.36L419.44,492.56H309.30L267.21,558.52H451.45L616.49,295.71L833.50,624.37H753.45L710.57,559.35H584.50L625.36,492.45H666.85L620.24,421.56L491.47,624.58H141.54L224.65,492.65H165.51L207.51,426.54ZM290.42,294.55H560.42L519.58,360.49H249.63L290.42,294.55Z"/>
          </svg>
        </div>
        <p>EA SVG</p>
      </div>
    </div>

    <div class="divider"></div>

    <label class="label">PHONE OR EMAIL</label>
    <input class="input" type="text" placeholder="Enter your phone or email">
    <input class="input" type="password" placeholder="Password">

    <label class="remember">
      <input type="checkbox" checked>
      <span>Keep me signed in</span>
    </label>

    <button class="primary-btn">NEXT</button>

    <a href="#" class="helper-link">Forgot your password, or need to create a new one?</a>

    <button class="secondary-btn">CREATE ACCOUNT</button>

    <div class="footer">Demo stran za prikaz PNG, Canvas in SVG logotipa.</div>
  </div>

  <script>
    const canvas = document.getElementById("eaCanvas");
    const ctx = canvas.getContext("2d");

    ctx.save();

    const scale = canvas.width / 1000;
    ctx.scale(scale, scale);

    ctx.fillStyle = "#ff4747";

    ctx.beginPath();
    ctx.moveTo(500.006, 934.393);
    ctx.bezierCurveTo(260.49, 934.393, 65.632, 739.531, 65.632, 500.014);
    ctx.bezierCurveTo(65.632, 260.494, 260.49, 65.633, 500.006, 65.633);
    ctx.bezierCurveTo(739.519, 65.633, 934.381, 260.495, 934.381, 500.014);
    ctx.bezierCurveTo(934.381, 739.53, 739.52, 934.393, 500.006, 934.393);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(573.527, 331.999);
    ctx.lineTo(328.041, 331.999);
    ctx.lineTo(290.794, 391.857);
    ctx.lineTo(535.998, 391.857);
    ctx.closePath();

    ctx.moveTo(623.695, 332.57);
    ctx.lineTo(473.624, 571.533);
    ctx.lineTo(307.16, 571.533);
    ctx.lineTo(345.565, 511.624);
    ctx.lineTo(445.336, 511.624);
    ctx.lineTo(483.448, 451.744);
    ctx.lineTo(252.794, 451.744);
    ctx.lineTo(214.69, 511.624);
    ctx.lineTo(269.331, 511.624);
    ctx.lineTo(193.519, 631.235);
    ctx.lineTo(509.908, 631.235);
    ctx.lineTo(626.768, 446.94);
    ctx.lineTo(669.377, 511.624);
    ctx.lineTo(630.957, 511.624);
    ctx.lineTo(594.572, 571.533);
    ctx.lineTo(708.345, 571.533);
    ctx.lineTo(747.851, 631.235);
    ctx.lineTo(820.427, 631.235);
    ctx.closePath();

    ctx.fillStyle = "white";
    ctx.fill();

    ctx.restore();
  </script>

</body>
</html>
